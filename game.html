<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Detektif Rupiah - Edisi Inklusif Lengkap</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; background-color: #f0fdf4; color: #1e293b; line-height: 1.6; padding: 20px; }
        
        .game-container { max-width: 700px; margin: 30px auto; background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 25px rgba(21, 128, 61, 0.15); border: 3px solid #22c55e; text-align: center; }
        
        h1 { color: #166534; font-size: 2rem; margin-bottom: 10px; }
        .score-board { font-size: 1.1rem; font-weight: bold; color: #15803d; margin-bottom: 20px; background: #dcfce7; padding: 8px 15px; border-radius: 30px; display: inline-block; }
        
        /* Layar Input Nama */
        .input-section { margin: 40px 0; }
        .input-control { width: 100%; max-width: 350px; padding: 12px; font-size: 1.1rem; border: 2px solid #cbd5e1; border-radius: 10px; margin-bottom: 15px; text-align: center; }
        .input-control:focus { border-color: #22c55e; outline: none; box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.2); }

        /* Area Pertanyaan */
        .clue-box { background: #f8fafc; border-left: 5px solid #22c55e; padding: 20px; border-radius: 10px; margin-bottom: 25px; text-align: left; font-size: 1.2rem; font-weight: 500; min-height: 80px; }
        .options-grid { display: grid; grid-template-columns: 1fr; gap: 15px; margin-bottom: 25px; }
        
        .btn-option { background: white; border: 2px solid #cbd5e1; padding: 15px 20px; border-radius: 12px; font-size: 1.1rem; font-weight: 600; color: #334155; cursor: pointer; transition: all 0.2s; text-align: left; width: 100%; }
        .btn-option:hover, .btn-option:focus { background: #f1f5f9; border-color: #0284c7; outline: none; box-shadow: 0 0 0 4px rgba(2, 132, 199, 0.2); }
        
        .btn-option.correct { background: #22c55e !important; color: white !important; border-color: #166534 !important; }
        .btn-option.wrong { background: #ef4444 !important; color: white !important; border-color: #991b1b !important; }
        
        .feedback-box { font-size: 1.3rem; font-weight: 700; margin: 20px 0; min-height: 40px; }
        .feedback-box.success { color: #166534; }
        .feedback-box.danger { color: #991b1b; }
        
        .btn-nav { background: #0284c7; color: white; border: none; padding: 12px 30px; border-radius: 10px; font-size: 1.1rem; font-weight: bold; cursor: pointer; transition: background 0.2s; margin: 0 auto; display: block; }
        .btn-nav:hover { background: #0369a1; }
        
        .btn-speak-clue { background: #e0f2fe; color: #0369a1; border: none; padding: 8px 16px; border-radius: 8px; font-size: 0.9rem; font-weight: 600; cursor: pointer; margin-bottom: 15px; display: inline-flex; align-items: center; gap: 5px; }
        .btn-back { display: inline-block; margin-top: 20px; color: #64748b; text-decoration: none; font-weight: 500; font-size: 0.95rem; }
        .btn-back:hover { color: #334155; text-decoration: underline; }

        /* Tabel Review Jawaban di Akhir Game */
        .review-section { text-align: left; margin-top: 30px; }
        .review-table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 0.95rem; background: #ffffff; border-radius: 8px; overflow: hidden; border: 1px solid #e2e8f0; }
        .review-table th, .review-table td { padding: 12px; border-bottom: 1px solid #e2e8f0; }
        .review-table th { background-color: #f1f5f9; color: #334155; font-weight: 600; }
        .badge-status { display: inline-block; padding: 3px 8px; border-radius: 6px; font-weight: bold; font-size: 0.8rem; }
        .badge-status.benar { background-color: #dcfce7; color: #15803d; }
        .badge-status.salah { background-color: #fee2e2; color: #b91c1c; }
    </style>
</head>
<body>

    <div class="game-container">
        <h1>🕵️‍♂️ Detektif Rupiah</h1>
        
        <div id="layer-start">
            <p style="color: #64748b; margin-top: 10px;">Sebelum memulai misi penyelidikan, silakan masukkan namamu dulu, Sobat!</p>
            <div class="input-section">
                <input type="text" id="player-name" class="input-control" placeholder="Ketik nama kamu di sini..." aria-label="Ketik nama kamu di sini untuk memulai game" autofocus><br>
                <button class="btn-nav" onclick="mulaiMisi()">Mulai Penyelidikan 🚀</button>
            </div>
        </div>

        <div id="layer-game" style="display: none;">
            <p id="greeting-text" style="color: #64748b; margin-bottom: 15px; font-weight: 600;"></p>
            <div class="score-board" id="score-display" aria-live="polite">Pertanyaan: 1/10 | Skor: 0</div>
            <br>
            <button class="btn-speak-clue" onclick="bacaSoal()">🔊 Dengarkan Soal (Aksesibilitas)</button>

            <div class="clue-box" id="clue-display" role="alert" aria-live="assertive">Memuat pertanyaan...</div>
            <div class="options-grid" id="options-container" role="radiogroup" aria-label="Pilihan Jawaban"></div>
            <div class="feedback-box" id="feedback-display" role="status" aria-live="polite"></div>
            <button class="btn-nav" id="btn-next" style="display: none;" onclick="lanjutPertanyaan()">Pertanyaan Selanjutnya →</button>
        </div>

        <div id="layer-result" style="display: none;">
            <div class="score-board" id="final-score-display" style="font-size: 1.4rem; padding: 15px 30px;">Skor Akhir: 0</div>
            <div class="feedback-box" id="final-feedback" style="margin-top: 10px;"></div>
            
            <div class="review-section">
                <h3 style="color: #166534; border-bottom: 2px solid #22c55e; padding-bottom: 8px;">📊 Evaluasi Review Jawaban:</h3>
                <div style="overflow-x: auto;">
                    <table class="review-table">
                        <thead>
                            <tr>
                                <th style="width: 50%;">Soal / Kasus</th>
                                <th>Jawaban Kamu</th>
                                <th>Status</th>
                            </tr>
                        </thead>
                        <tbody id="review-tbody"></tbody>
                    </table>
                </div>
            </div>
            
            <button class="btn-nav" style="margin-top: 25px; background-color: #166534;" onclick="lokasiReset()">Main Lagi 🔄</button>
        </div>
        
        <hr style="margin-top: 30px; border: 0; border-top: 1px solid #e2e8f0;">
        <a href="index.html" class="btn-back">← Kembali ke Halaman Utama</a>
    </div>

    <script>
        const bankSoal = [
            { clue: "Asal-usul nama mata uang kita, Rupiah, diambil dari bahasa Sanskerta 'rupya' yang memiliki arti...", opsi: ["Emas murni", "Kertas berharga", "Perak atau kekayaan", "Alat tukar dunia"], jawaban: 2 },
            { clue: "Kapan Oeang Republik Indonesia (ORI) resmi diterbitkan pertama kali sebagai wujud kedaulatan ekonomi Indonesia?", opsi: ["17 Agustus 1945", "30 Oktober 1946", "17 Agustus 1950", "30 Oktober 1953"], jawaban: 1 },
            { clue: "Lembaga negara manakah yang memegang mandat penuh sebagai penerbit dan pengelola tunggal uang Rupiah sejak tahun 1953?", opsi: ["Kementerian Keuangan", "Otoritas Jasa Keuangan (OJK)", "Bank Indonesia", "Bank Negara Indonesia (BNI)"], jawaban: 2 },
            { clue: "Saat meraba lembaran Rupiah asli, bagian nominal atau gambar pahlawan akan terasa agak kasar. Teknik cetak khusus ini bernama...", opsi: ["Teknik Intaglio", "Teknik Watermark", "Teknik Silhouette", "Teknik Cetak Offset"], jawaban: 0 },
            { clue: "Ketika mengarahkan uang kertas Rupiah ke arah cahaya, kamu melihat bayangan gambar pahlawan di dalam kertas. Fitur pengaman ini disebut...", opsi: ["Benang Pengaman", "Watermark (Tanda Air)", "Badge 3D", "Cetakan Kasar"], jawaban: 1 },
            { clue: "Menjaga fisik uang kertas agar tidak rusak dengan cara tidak meremas atau mencoret-coret merupakan wujud dari sikap...", opsi: ["Cinta Rupiah", "Bangga Rupiah", "Paham Rupiah", "Koleksi Rupiah"], jawaban: 0 },
            { clue: "Manakah di bawah ini yang merupakan tindakan yang dilarang dalam gerakan 'Gerakan 5 Jangan' untuk merawat Rupiah?", opsi: ["Jangan disimpan di dompet", "Jangan difoto", "Jangan dilipat dan jangan distapler", "Jangan dibelanjakan"], jawaban: 2 },
            { clue: "Memahami dan memperlakukan uang Rupiah setara sebagai Lambang Kedaulatan Negara (seperti Bendera Merah Putih) merupakan esensi dari sikap...", opsi: ["Cinta Rupiah", "Bangga Rupiah", "Paham Rupiah", "Hemat Rupiah"], jawaban: 1 },
            { clue: "Saat ini transaksi di Indonesia bisa dilakukan dengan dua cara mudah, yaitu secara tunai (uang fisik) dan secara non-tunai melalui platform digital resmi yaitu...", opsi: ["Barcode Toko", "Kupon Belanja", "QRIS atau Mobile Banking", "Nota Penjualan"], jawaban: 2 },
            { clue: "Membawa bekal makanan dari rumah ke sekolah serta rajin menyisihkan uang saku ke celengan merupakan contoh nyata dari sikap...", opsi: ["Cinta Rupiah", "Bangga Rupiah", "Paham Rupiah (Paham Berhemat)", "Sikap Menimbun Uang"], jawaban: 2 }
        ];

        let namaPemain = "Detektif";
        let indexSekarang = 0;
        let skor = 0;
        let sudahMenjawab = false;
        let rekamanJawaban = [];

        // Deteksi Aksesibilitas Tombol Enter pada Input Nama
        document.getElementById("player-name").addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                event.preventDefault();
                mulaiMisi();
            }
        });

        function mulaiMisi() {
            const inputNama = document.getElementById("player-name").value.trim();
            if(inputNama !== "") {
                namaPemain = inputNama;
            }
            document.getElementById("layer-start").style.display = "none";
            document.getElementById("layer-game").style.display = "block";
            document.getElementById("greeting-text").innerText = `🔍 Agen Ops: ${namaPemain}, mari mulai analisis bukti-bukti!`;
            muatPertanyaan();
        }

        function muatPertanyaan() {
            sudahMenjawab = false;
            document.getElementById("btn-next").style.display = "none";
            document.getElementById("feedback-display").innerText = "";
            document.getElementById("feedback-display").className = "feedback-box";
            
            let data = bankSoal[indexSekarang];
            document.getElementById("score-display").innerText = `Pertanyaan: ${indexSekarang + 1}/${bankSoal.length} | Skor: ${skor}`;
            document.getElementById("clue-display").innerText = data.clue;
            
            setTimeout(() => { bacaSoal(); }, 400);

            const container = document.getElementById("options-container");
            container.innerHTML = "";
            data.opsi.forEach((opsiTeks, index) => {
                const button = document.createElement("button");
                button.className = "btn-option";
                button.innerText = opsiTeks;
                button.setAttribute("role", "radio");
                button.setAttribute("aria-checked", "false");
                button.addEventListener("click", () => cekJawaban(index, button));
                container.appendChild(button);
            });
        }

        function cekJawaban(indeksDipilih, tombolAktif) {
            if (sudahMenjawab) return;
            sudahMenjawab = true;

            const data = bankSoal[indexSekarang];
            const semuaTombol = document.querySelectorAll(".btn-option");
            let statusBenar = (indeksDipilih === data.jawaban);

            rekamanJawaban.push({
                soal: data.clue,
                jawabanUser: data.opsi[indeksDipilih],
                isCorrect: statusBenar
            });

            if (statusBenar) {
                skor += 10;
                tombolAktif.classList.add("correct");
                tombolAktif.setAttribute("aria-checked", "true");
                document.getElementById("feedback-display").innerText = "🎉 Benar! Analisismu luar biasa!";
                document.getElementById("feedback-display").className = "feedback-box success";
                suarakanTeks("Jawaban benar!");
            } else {
                tombolAktif.classList.add("wrong");
                semuaTombol[data.jawaban].classList.add("correct");
                document.getElementById("feedback-display").innerText = "❌ Kurang tepat, perhatikan fiturnya.";
                document.getElementById("feedback-display").className = "feedback-box danger";
                suarakanTeks("Jawaban kurang tepat.");
            }

            document.getElementById("score-display").innerText = `Pertanyaan: ${indexSekarang + 1}/${bankSoal.length} | Skor: ${skor}`;
            
            const btnNext = document.getElementById("btn-next");
            btnNext.innerText = indexSekarang < bankSoal.length - 1 ? "Pertanyaan Selanjutnya →" : "Selesaikan Misi & Lihat Hasil 🎓";
            btnNext.style.display = "block";
            btnNext.focus();
        }

        function lanjutPertanyaan() {
            if (indexSekarang < bankSoal.length - 1) {
                indexSekarang++;
                muatPertanyaan();
            } else {
                window.speechSynthesis.cancel();
                document.getElementById("layer-game").style.display = "none";
                document.getElementById("layer-result").style.display = "block";
                
                document.getElementById("final-score-display").innerText = `Misi Selesai, ${namaPemain}! Skor: ${skor}/100`;
                
                const finalFeedback = document.getElementById("final-feedback");
                if(skor >= 80) {
                    finalFeedback.innerText = "🏆 Hebat! Kamu sah menjadi Detektif Rupiah Unggul yang Inklusif!";
                    finalFeedback.className = "feedback-box success";
                } else {
                    finalFeedback.innerText = "👍 Bagus sudah mencoba! Yuk baca ulang materinya agar lebih paham.";
                    finalFeedback.className = "feedback-box danger";
                }

                const tbody = document.getElementById("review-tbody");
                tbody.innerHTML = "";
                rekamanJawaban.forEach((item, index) => {
                    const tr = document.createElement("tr");
                    tr.innerHTML = `
                        <td><strong>${index + 1}.</strong> ${item.soal}</td>
                        <td>${item.jawabanUser}</td>
                        <td><span class="badge-status ${item.isCorrect ? 'benar' : 'salah'}">${item.isCorrect ? 'Benar' : 'Salah'}</span></td>
                    `;
                    tbody.appendChild(tr);
                });

                suarakanTeks(`Misi selesai ${namaPemain}. Skor akhir kamu adalah ${skor} poin. ${finalFeedback.innerText}`);
            }
        }

        function suarakanTeks(teks) {
            window.speechSynthesis.cancel();
            const ucapan = new SpeechSynthesisUtterance(teks);
            ucapan.lang = 'id-ID';
            window.speechSynthesis.speak(ucapan);
        }

        function bacaSoal() {
            let data = bankSoal[indexSekarang];
            let teksPilihan = "";
            data.opsi.forEach((o, i) => { teksPilihan += ` Pilihan ${i+1}: ${o}.`; });
            suarakanTeks(data.clue + teksPilihan);
        }

        function lokasiReset() {
            location.reload();
        }
    </script>
</body>
</html>
